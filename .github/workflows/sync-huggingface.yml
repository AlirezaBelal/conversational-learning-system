name: Sync Hugging Face Space

on:
  push:
    branches: [master]
    paths:
      - "hf-space/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Publish Space
        env:
          HF_OIDC_RESOURCE: spaces/AlirezaBelal/conversational-learning-system
        run: |
          hf upload AlirezaBelal/conversational-learning-system ./hf-space . --repo-type space --commit-message "Deploy from GitHub ${GITHUB_SHA::7}"
